    <script>
      // Ignorer silencieusement les erreurs de WebSocket HMR dans l'environnement proxy iframe
      window.addEventListener('error', function (event) {
        if (
          event &&
          (event.message?.includes('WebSocket') ||
            event.message?.includes('closed without opened') ||
            event.filename?.includes('@vite/client'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event &&
          event.reason &&
          typeof event.reason.message === 'string' &&
          (event.reason.message.includes('WebSocket') || event.reason.message.includes('closed without opened'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
